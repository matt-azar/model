# Longer Phase 2 run (overnight-friendly on a single GPU / strong CPU).
# Launch:
#   export PYTHONPATH=.
#   python3 -m src.train --config configs/pretrain_overnight.yaml
# Resume later:
#   python3 -m src.train --config configs/pretrain_overnight.yaml \
#     --resume runs/pretrain_overnight/ckpt_latest.pt
seed: 42
device: auto
dtype: float32
manifest: data/manifest.json

tokenizer:
  path: tokenizer

model:
  n_layer: 4
  n_embd: 256
  n_head: 4
  block_size: 256
  dropout: 0.0
  bias: false

data:
  stand_in: true
  streaming: true
  train_path: data/standin/train.jsonl
  val_path: data/standin/val.jsonl
  seq_len: 256
  batch_size: 8

train:
  steps: null
  token_budget: 5000000
  lr: 1.0e-3
  weight_decay: 0.1
  grad_clip: 1.0
  log_every: 50
  save_every: 1000
  eval_every: 500
  eval_batches: 20
  overfit_loss_threshold: null
  run_name: pretrain_overnight

checkpoint:
  dir: runs/pretrain_overnight
  resume: null

[project]
name = "reasoning-llm"
version = "0.1.0"
description = "Personal small reasoning LLM foundation (Phase 0)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.1",
  "PyYAML>=6.0",
  "tokenizers>=0.19",
  "pyarrow>=14.0",
  "numpy>=2.0",
  "transformers>=4.52,<5",
  "accelerate>=0.30",
  "safetensors>=0.4",
  "datasets>=3.6,<4",
  "huggingface-hub>=0.30,<1",
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["gui_assets/*.html", "gui_assets/*.css", "gui_assets/*.js"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

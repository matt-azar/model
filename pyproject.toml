[project]
name = "reasoning-llm"
version = "0.1.0"
description = "Personal small reasoning LLM foundation (Phase 0)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.1",
  "PyYAML>=6.0",
  "tokenizers>=0.19",
  "pyarrow>=14.0",
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
